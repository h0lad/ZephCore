# Lora Harvester Box (RAK3172 / STM32WLE5CC). USART1 console, no BLE/USB.

CONFIG_ZEPHCORE_BOARD_NAME="Lora Harvester Box"
CONFIG_BT_DIS_MODEL_NUMBER_STR="Lora Harvester Box"

# CONFIG_ZEPHCORE_ADMIN_PASSWORD="password"

# EU868/Narrow preset (869.618 MHz / 62.5 kHz / SF 8)
CONFIG_ZEPHCORE_DEFAULT_LORA_SF=8

CONFIG_ZEPHCORE_LORA_RX_DUTY_CYCLE=y

# +22 dBm RFO_HP
CONFIG_ZEPHCORE_DEFAULT_TX_POWER_DBM=22

# 64KB SRAM: same caps as the LoRa-E5 mini
CONFIG_ZEPHCORE_MAX_CONTACTS=12
CONFIG_ZEPHCORE_OFFLINE_QUEUE_SIZE=2
CONFIG_ZEPHCORE_MAX_CHANNELS=8
CONFIG_ZEPHCORE_BLE_QUEUE_SIZE=12
